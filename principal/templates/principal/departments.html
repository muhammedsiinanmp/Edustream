{% extends 'base.html' %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="fw-bold">Departments</h2>
  <a href="{% url 'principal:admin_add_department' %}" class="btn btn-primary">
    + Add Department
  </a>
</div>

<div class="table-responsive">
  <table class="table table-bordered align-middle shadow-sm">
    <thead class="table-light">
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th style="width: 150px;">Actions</th>
      </tr>
    </thead>

    <tbody>
      {% for dept in departments %}
      <tr>
        <td class="fw-semibold">{{ dept.name }}</td>
        <td class="text-muted">
          {{ dept.description|truncatewords:15 }}
        </td>
        <td>
          <a href="{% url 'principal:admin_edit_department' dept.id %}"
             class="btn btn-sm btn-warning me-1">
            Edit
          </a>
          <a href="{% url 'principal:admin_delete_department' dept.id %}"
             class="btn btn-sm btn-danger"
             onclick="return confirm('Delete this department?')">
            Delete
          </a>
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="3" class="text-center text-muted">
          No departments found
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

{% endblock %}
