<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edustream | Learning Management System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f8fafc, #eef2ff);
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .hero-card {
            border-radius: 20px;
        }

        .brand {
            color: #4f46e5;
        }
    </style>
</head>
<body>

<div class="container hero">
    <div class="row justify-content-center w-100">
        <div class="col-md-8 col-lg-6">

            <div class="card hero-card shadow-lg border-0">
                <div class="card-body p-5 text-center">

                    <h1 class="fw-bold mb-2">
                        Welcome to <span class="brand">Edustream</span>
                    </h1>

                    <p class="text-muted mb-4">
                        A modern learning management platform for students and administrators.
                    </p>

                    <div class="d-grid gap-3">
                        <a href="{% url 'student:login' %}"
                           class="btn btn-primary btn-lg">
                            Login
                        </a>

                        <a href="{% url 'student:register' %}"
                           class="btn btn-outline-primary btn-lg">
                            Register as Student
                        </a>
                    </div>

                    <hr class="my-4">

                    <p class="small text-muted mb-0">
                        © {{ year|default:"2026" }} Edustream · Built with Django
                    </p>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
