{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="fw-bold mb-2">Forgot Password</h4>
        <p class="text-muted">
          Enter your registered email. We’ll send you a reset link.
        </p>

        <form method="post">
          {% csrf_token %}
          {{ form.email }}
          <button class="btn btn-primary w-100 mt-3">
            Send Reset Link
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
