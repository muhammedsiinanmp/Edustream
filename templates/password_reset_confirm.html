{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="fw-bold mb-3">Set New Password</h4>

        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button class="btn btn-success w-100">
            Update Password
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
