{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        {% if validlink %}
        <h4 class="fw-bold mb-3">Set New Password</h4>

        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button class="btn btn-success w-100">
            Update Password
          </button>
        </form>
        {% else %}
        <h4 class="fw-bold mb-3">Reset Link Not Valid</h4>
        <p class="text-muted">
          This password reset link has expired or has already been used.
          Request a new link to continue.
        </p>
        <a href="{% url 'student:password_reset' %}" class="btn btn-primary w-100">
          Request a New Link
        </a>
        {% endif %}
      </div>
    </div>
  </div>
</div>

{% endblock %}
